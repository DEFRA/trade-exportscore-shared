variables:
  environment: PRD
  environmentTag: PRD
  environmentLower: prd
  containerName: 'trade-exportscore-$(prj)'
  containerJobName: 'trade-exportscore-$(prj)-trigger'

  # KEYVAULT
  keyVaultSku: Standard
  servicePrincipalObjectId: 69251de5-ed46-46a2-b9e6-e183a59b3c08

  # NETWORKING
  vnet01AddressPrefix01: 10.179.73.0/24
  vnet01AddressPrefix02: 10.179.66.0/23
  vnet01AddressPrefix03: 10.179.63.128/25
  vnet01Subnet1Address: 10.179.73.0/24
  vnet01Subnet2Address: 10.179.66.0/23
  vnet01Subnet3Address: 10.179.63.128/25

  # SERVICE CONNECTION
  azureResourceManagerConnection: AZR-EXP-PRD1
  azureSubscription: AZR-EXP-PRD1
  subscriptionId: 9f93a159-97af-42db-9041-6426ae76c837
  tenantId: 770a2450-0227-4c62-90c7-4e38537f1102

  # DATABASE
  postgreSqlTier: "GeneralPurpose"
  postgreSqlSkuName: "Standard_D4ds_v5"
  postgreSqlStorageSizeGB: 128
  postgreSqlHighAvailability: "Disabled"
  postgreSqlAvailabilityZone: ""

  # LOG ANALYICS
  logAnalyticsSku: 'PerGB2018'

  # CONTAINER REGISTRY
  acrSku: Premium
  azureADAuthenticationAsArmPolicyStatus: enabled
  exportPolicyStatus: enabled
  softDeletePolicyStatus: disabled
  trustPolicyStatus: enabled

  # CONTAINER APP
  containerCpu: '2'
  containerMemory: '4Gi'