variables:
  environment: PRE
  environmentTag: PRE
  environmentLower: pre
  containerName: 'trade-exportscore-$(prj)'
  containerJobName: 'trade-exportscore-$(prj)-trigger'

  # KEYVAULT
  keyVaultSku: Standard
  servicePrincipalObjectId: 5d9cebba-cb3d-4720-abba-19b1fc86e3bc

  # NETWORKING
  vnet01AddressPrefix01: 10.179.72.0/24
  vnet01AddressPrefix02: 10.179.64.0/23
  vnet01AddressPrefix03: 10.179.63.0/25
  vnet01Subnet1Address: 10.179.72.0/24
  vnet01Subnet2Address: 10.179.64.0/23
  vnet01Subnet3Address: 10.179.63.0/25

  # SERVICE CONNECTION
  azureResourceManagerConnection: AZR-EXP-PRE1
  azureSubscription: AZR-EXP-PRE1
  subscriptionId: 9f93a159-97af-42db-9041-6426ae76c837
  tenantId: 770a2450-0227-4c62-90c7-4e38537f1102

  # DATABASE
  postgreSqlTier: "GeneralPurpose"
  postgreSqlSkuName: "Standard_D4ds_v5"
  postgreSqlStorageSizeGB: 128
  postgreSqlHighAvailability: "Disabled"
  postgreSqlAvailabilityZone: ""

  # LOG ANALYICS
  logAnalyticsSku: 'PerGB2018'

  # CONTAINER REGISTRY
  acrSku: Premium
  azureADAuthenticationAsArmPolicyStatus: enabled
  exportPolicyStatus: enabled
  softDeletePolicyStatus: disabled
  trustPolicyStatus: enabled

  # CONTAINER APP
  containerCpu: '2'
  containerMemory: '4Gi'